# Elasticsearch + Kibana from Elastic's official images.
# Security is DISABLED on purpose for this lab: the VM has no public IP and
# elk-nsg restricts who can connect. A production SIEM would enable it.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    mem_limit: 4g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 2g
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  esdata:
